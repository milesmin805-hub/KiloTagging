<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kilo - GameChanger Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #050816; color: #e5e7eb; min-height: 100vh; }
header { padding: 16px 20px; border-bottom: 1px solid rgba(148,163,184,0.3); background: radial-gradient(circle at top left, rgba(56,189,248,0.15), transparent 55%); display: flex; justify-content: space-between; align-items: center; }
.brand { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.brand-mark { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #22d3ee, #0f172a); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
.brand-text .title { font-size: 16px; font-weight: 600; }
.brand-text .subtitle { font-size: 11px; color: #9ca3af; }
.btn { padding: 8px 14px; border: 1px solid rgba(148,163,184,0.5); background: rgba(15,23,42,0.9); color: #e5e7eb; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.15s ease; }
.btn:hover { border-color: rgba(56,189,248,0.9); box-shadow: 0 0 12px rgba(56,189,248,0.4); }
main { padding: 24px 20px; max-width: 900px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.page-title { font-size: 24px; font-weight: 700; color: #22d3ee; }
.upload-btn { padding: 10px 20px; background: linear-gradient(135deg, #22d3ee, #0891b2); border: none; color: #000; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 13px; }
.games-grid { display: flex; flex-direction: column; gap: 12px; }
.game-card { background: rgba(15,23,42,0.9); border: 1px solid rgba(148,163,184,0.3); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.15s ease; display: flex; justify-content: space-between; align-items: center; }
.game-card:hover { border-color: rgba(34,211,238,0.6); box-shadow: 0 0 16px rgba(34,211,238,0.15); }
.game-info { display: flex; flex-direction: column; gap: 4px; }
.game-teams { font-size: 16px; font-weight: 600; color: #e5e7eb; }
.game-teams span { color: #22d3ee; }
.game-meta { font-size: 12px; color: #9ca3af; }
.game-date { font-size: 13px; color: #9ca3af; text-align: right; }
.home-away-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.badge-away { background: rgba(251,191,36,0.2); color: #fbbf24; }
.badge-home { background: rgba(134,239,172,0.2); color: #86efac; }
.delete-btn { background: none; border: 1px solid rgba(252,165,165,0.3); color: #fca5a5; font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer; margin-left: 12px; transition: all 0.15s ease; }
.delete-btn:hover { background: rgba(252,165,165,0.1); border-color: rgba(252,165,165,0.6); }
.empty-state { text-align: center; padding: 80px 20px; color: #9ca3af; }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-size: 18px; font-weight: 600; color: #e5e7eb; margin-bottom: 8px; }
.loading { text-align: center; padding: 60px; color: #9ca3af; }
.hamburger-btn { background: none; border: none; color: #e5e7eb; font-size: 20px; cursor: pointer; padding: 4px 8px; }
.side-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998; }
.side-menu-overlay.open { display: block; }
.side-menu { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #0f172a; border-right: 1px solid rgba(148,163,184,0.3); z-index: 999; transition: left 0.25s ease; display: flex; flex-direction: column; }
.side-menu.open { left: 0; }
.side-menu-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 16px; border-bottom: 1px solid rgba(148,163,184,0.2); font-weight: 600; color: #22d3ee; }
.side-menu-close { background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; padding: 4px; width: auto; }
.side-menu-item { display: flex; align-items: center; gap: 12px; padding: 16px; cursor: pointer; color: #e5e7eb; font-size: 14px; border-bottom: 1px solid rgba(148,163,184,0.1); transition: background 0.15s ease; }
.side-menu-item:hover { background: rgba(56,189,248,0.1); }
</style>
</head>
<body>
<div id="sideMenuOverlay" class="side-menu-overlay" onclick="toggleMenu()"></div>
<div id="sideMenu" class="side-menu">
  <div class="side-menu-header"><span>Menu</span><button class="side-menu-close" onclick="toggleMenu()">✕</button></div>
  <div class="side-menu-item" onclick="window.location.href='/all-pitchers.html'">Pitchers</div>
  <div class="side-menu-item" onclick="window.location.href='/all-hitters.html'">Hitters</div>
  <div class="side-menu-item" onclick="window.location.href='/pitchers-by-team.html'">Pitchers by Team</div>
  <div class="side-menu-item" onclick="window.location.href='/hitters-by-team.html'">Hitters by Team</div>
  <div class="side-menu-item" onclick="window.location.href='/matchups.html'">Matchups</div>
</div>
<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    <div class="brand" onclick="window.location.href='/dashboard.html'">
      <div class="brand-mark">⚾</div>
      <div class="brand-text"><div class="title">Kilo</div><div class="subtitle">Baseball</div></div>
    </div>
  </div>
  <button class="btn" onclick="window.location.href='/gc-upload.html'">+ Upload Game</button>
</header>
<main>
  <div class="page-header">
    <div class="page-title">GameChanger Games</div>
  </div>
  <div id="loading" class="loading">Loading games...</div>
  <div id="gamesContainer" class="games-grid" style="display:none;"></div>
</main>
<script>
const token = localStorage.getItem("token");

window.addEventListener("load", async () => {
  if (!token) { window.location.href = "/login.html"; return; }
  await loadGames();
});

async function loadGames() {
  try {
    const res = await fetch(`/gc-games?token=${token}`);
    const data = await res.json();
    document.getElementById("loading").style.display = "none";
    const container = document.getElementById("gamesContainer");
    container.style.display = "flex";

    if (!data.success || data.games.length === 0) {
      container.innerHTML = `<div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-title">No games yet</div>
        <div style="margin-top:16px;">
          <button onclick="window.location.href='/gc-upload.html'" style="padding:10px 20px; background:linear-gradient(135deg,#22d3ee,#0891b2); border:none; color:#000; font-weight:700; border-radius:8px; cursor:pointer;">Upload Your First Game</button>
        </div>
      </div>`;
      return;
    }

    // Group by date
    const grouped = {};
    data.games.forEach(g => {
      const date = g.game_date || "Unknown Date";
      if (!grouped[date]) grouped[date] = [];
      grouped[date].push(g);
    });

    container.innerHTML = Object.entries(grouped).map(([date, games]) => `
      <div style="margin-bottom:8px;">
        <div style="font-size:11px; color:#9ca3af; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;">${formatDate(date)}</div>
        ${games.map(g => `
          <div class="game-card" onclick="window.location.href='/gc-game.html?gameId=${g.id}'">
            <div class="game-info">
              <div class="game-teams"><span>${g.team_name}</span> vs ${g.opponent}</div>
              <div class="game-meta">
                <span class="home-away-badge ${g.home_away === 'away' ? 'badge-away' : 'badge-home'}">${g.home_away || 'N/A'}</span>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <button class="delete-btn" onclick="event.stopPropagation(); deleteGame('${g.id}', this)">Delete</button>
            </div>
          </div>
        `).join("")}
      </div>
    `).join("");
  } catch (err) {
    document.getElementById("loading").textContent = "Error loading games";
  }
}

function formatDate(dateStr) {
  if (!dateStr || dateStr === "Unknown Date") return "Unknown Date";
  const parts = dateStr.split("/");
  if (parts.length !== 3) return dateStr;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[parseInt(parts[1])-1]} ${parseInt(parts[2])}, ${parts[0]}`;
}

async function deleteGame(gameId, btn) {
  if (!confirm("Delete this game and all its stats?")) return;
  try {
    const res = await fetch(`/gc-game/${gameId}?token=${token}`, { method: "DELETE" });
    const data = await res.json();
    if (data.success) await loadGames();
    else alert("Failed to delete: " + data.error);
  } catch (err) {
    alert("Error: " + err.message);
  }
}

function toggleMenu() {
  document.getElementById("sideMenu").classList.toggle("open");
  document.getElementById("sideMenuOverlay").classList.toggle("open");
}
</script>
</body>
</html>
