<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kilo - Upload GameChanger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #050816; color: #e5e7eb; min-height: 100vh;
}
header {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(148,163,184,0.3);
  background: radial-gradient(circle at top left, rgba(56,189,248,0.15), transparent 55%);
  display: flex; justify-content: space-between; align-items: center;
}
.brand { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #22d3ee, #0f172a);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
}
.brand-text .title { font-size: 16px; font-weight: 600; }
.brand-text .subtitle { font-size: 11px; color: #9ca3af; }
.btn {
  padding: 8px 14px; border: 1px solid rgba(148,163,184,0.5);
  background: rgba(15,23,42,0.9); color: #e5e7eb;
  border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.15s ease;
}
.btn:hover { border-color: rgba(56,189,248,0.9); box-shadow: 0 0 12px rgba(56,189,248,0.4); }
main { padding: 40px 20px; max-width: 600px; margin: 0 auto; }
.page-title { font-size: 24px; font-weight: 700; color: #22d3ee; margin-bottom: 8px; }
.page-sub { font-size: 13px; color: #9ca3af; margin-bottom: 32px; }
.card {
  background: rgba(15,23,42,0.9); border: 1px solid rgba(148,163,184,0.3);
  border-radius: 12px; padding: 28px;
}
.upload-area {
  border: 2px dashed rgba(148,163,184,0.4); border-radius: 10px;
  padding: 48px 24px; text-align: center; cursor: pointer;
  transition: all 0.2s ease; margin-bottom: 20px;
}
.upload-area:hover, .upload-area.drag-over {
  border-color: #22d3ee; background: rgba(34,211,238,0.05);
}
.upload-icon { font-size: 40px; margin-bottom: 12px; }
.upload-label { font-size: 15px; font-weight: 600; color: #e5e7eb; margin-bottom: 6px; }
.upload-sub { font-size: 12px; color: #9ca3af; }
.file-input { display: none; }
.selected-file {
  display: none; background: rgba(34,211,238,0.1);
  border: 1px solid rgba(34,211,238,0.3); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 20px;
  font-size: 13px; color: #22d3ee;
}
.submit-btn {
  width: 100%; padding: 14px; border: none;
  background: linear-gradient(135deg, #22d3ee, #0891b2);
  color: #000; font-size: 15px; font-weight: 700;
  border-radius: 8px; cursor: pointer; transition: opacity 0.15s ease;
}
.submit-btn:hover { opacity: 0.9; }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.status {
  margin-top: 20px; padding: 14px 16px; border-radius: 8px;
  font-size: 13px; display: none;
}
.status.success { background: rgba(134,239,172,0.15); border: 1px solid rgba(134,239,172,0.4); color: #86efac; }
.status.error { background: rgba(252,165,165,0.15); border: 1px solid rgba(252,165,165,0.4); color: #fca5a5; }
.status.loading { background: rgba(34,211,238,0.1); border: 1px solid rgba(34,211,238,0.3); color: #22d3ee; }
.view-games-btn {
  display: none; width: 100%; padding: 12px; margin-top: 12px;
  background: rgba(134,239,172,0.15); border: 1px solid rgba(134,239,172,0.4);
  color: #86efac; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 600; text-align: center;
}
.hamburger-btn { background: none; border: none; color: #e5e7eb; font-size: 20px; cursor: pointer; padding: 4px 8px; }
.side-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998; }
.side-menu-overlay.open { display: block; }
.side-menu { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #0f172a; border-right: 1px solid rgba(148,163,184,0.3); z-index: 999; transition: left 0.25s ease; display: flex; flex-direction: column; }
.side-menu.open { left: 0; }
.side-menu-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 16px; border-bottom: 1px solid rgba(148,163,184,0.2); font-weight: 600; color: #22d3ee; }
.side-menu-close { background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; padding: 4px; width: auto; }
.side-menu-item { display: flex; align-items: center; gap: 12px; padding: 16px; cursor: pointer; color: #e5e7eb; font-size: 14px; border-bottom: 1px solid rgba(148,163,184,0.1); transition: background 0.15s ease; }
.side-menu-item:hover { background: rgba(56,189,248,0.1); }
</style>
</head>
<body>
<div id="sideMenuOverlay" class="side-menu-overlay" onclick="toggleMenu()"></div>
<div id="sideMenu" class="side-menu">
  <div class="side-menu-header"><span>Menu</span><button class="side-menu-close" onclick="toggleMenu()">✕</button></div>
  <div class="side-menu-item" onclick="window.location.href='/all-pitchers.html'">Pitchers</div>
  <div class="side-menu-item" onclick="window.location.href='/all-hitters.html'">Hitters</div>
  <div class="side-menu-item" onclick="window.location.href='/pitchers-by-team.html'">Pitchers by Team</div>
  <div class="side-menu-item" onclick="window.location.href='/hitters-by-team.html'">Hitters by Team</div>
  <div class="side-menu-item" onclick="window.location.href='/matchups.html'">Matchups</div>
</div>
<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
    <div class="brand" onclick="window.location.href='/dashboard.html'">
      <div class="brand-mark">⚾</div>
      <div class="brand-text"><div class="title">Kilo</div><div class="subtitle">Baseball</div></div>
    </div>
  </div>
  <button class="btn" onclick="window.location.href='/gc-games.html'">View Games</button>
</header>
<main>
  <div class="page-title">Upload GameChanger</div>
  <div class="page-sub">Upload a GameChanger scorebook PDF to import batting and pitching stats</div>
  <div class="card">
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()"
         ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
      <div class="upload-icon">📋</div>
      <div class="upload-label">Drop your GameChanger PDF here</div>
      <div class="upload-sub">or click to browse</div>
    </div>
    <input type="file" id="fileInput" class="file-input" accept=".pdf" onchange="handleFileSelect(event)" />
    <div class="selected-file" id="selectedFile"></div>
    <button class="submit-btn" id="submitBtn" onclick="uploadPDF()" disabled>Upload & Import</button>
    <div class="status" id="status"></div>
    <button class="view-games-btn" id="viewGamesBtn" onclick="window.location.href='/gc-games.html'">View All Games →</button>
  </div>
</main>
<script>
let selectedFile = null;
const token = localStorage.getItem("token");

window.addEventListener("load", () => {
  if (!token) window.location.href = "/login.html";
});

function handleDragOver(e) {
  e.preventDefault();
  document.getElementById("uploadArea").classList.add("drag-over");
}
function handleDragLeave(e) {
  document.getElementById("uploadArea").classList.remove("drag-over");
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById("uploadArea").classList.remove("drag-over");
  const file = e.dataTransfer.files[0];
  if (file && file.type === "application/pdf") setFile(file);
  else showStatus("Please drop a PDF file", "error");
}
function handleFileSelect(e) {
  const file = e.target.files[0];
  if (file) setFile(file);
}
function setFile(file) {
  selectedFile = file;
  const sf = document.getElementById("selectedFile");
  sf.style.display = "block";
  sf.textContent = `📄 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
  document.getElementById("submitBtn").disabled = false;
}

async function uploadPDF() {
  if (!selectedFile) return;
  showStatus("Parsing scorebook — this may take 10-20 seconds...", "loading");
  document.getElementById("submitBtn").disabled = true;

  const formData = new FormData();
  formData.append("pdf", selectedFile);
  formData.append("token", token);

  try {
    const res = await fetch("/upload-gc", { method: "POST", body: formData });
    const data = await res.json();

    if (!data.success) {
      showStatus("Error: " + data.error, "error");
      document.getElementById("submitBtn").disabled = false;
      return;
    }

    const teams = data.games.map(g => g.teamName).join(" & ");
    showStatus(`✅ Successfully imported stats for: ${teams}`, "success");
    document.getElementById("viewGamesBtn").style.display = "block";
  } catch (err) {
    showStatus("Upload failed: " + err.message, "error");
    document.getElementById("submitBtn").disabled = false;
  }
}

function showStatus(msg, type) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = `status ${type}`;
  el.style.display = "block";
}

function toggleMenu() {
  document.getElementById("sideMenu").classList.toggle("open");
  document.getElementById("sideMenuOverlay").classList.toggle("open");
}
</script>
</body>
</html>
